# Headless Service (clusterIP: None): DNS returns the pod IP directly,
# e.g. postgres-0.postgres.payflow-dev.svc.cluster.local. Required by the StatefulSet's serviceName.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: payflow-dev
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: payflow
    app.kubernetes.io/component: database
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: payflow
  ports:
  - name: postgres
    port: 5432
    targetPort: postgres
    protocol: TCP
