apiVersion: v1
kind: Namespace
metadata:
  name: payflow-dev
  labels:
    app.kubernetes.io/part-of: payflow
    environment: dev
    # Pod Security Admission: enforce baseline now; warn and audit against restricted,
    # so every apply lists what would still break under restricted.
    # Not enforcing restricted yet: the official postgres image needs its own settings
    # (see 11-postgres-statefulset.yaml) and is reviewed again in Task 3.3.3.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
