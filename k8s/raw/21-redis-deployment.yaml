apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: payflow-dev
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: payflow
    app.kubernetes.io/component: cache
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/part-of: payflow
      app.kubernetes.io/component: cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: payflow
        app.kubernetes.io/component: cache
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        emptyDir: {}
      containers:
      - image: redis:7.4.11
        name: redis
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: true
        volumeMounts:
        - name: data
          mountPath: /data
        args: ["--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
        ports:
        - name: redis
          containerPort: 6379
        readinessProbe:
          exec:
            command:
            - redis-cli
            - ping
          periodSeconds: 5
        livenessProbe:
          exec:
            command:
            - redis-cli
            -  ping
          periodSeconds: 10
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            memory: "128Mi"
